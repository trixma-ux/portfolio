name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Copy only the static site into ./public. Publishing "." directly makes
      # peaceiris' exclude step delete the temporary gh-pages repo's own .git
      # folder, which is what broke every previous run.
      - name: Prepare site
        run: |
          mkdir -p public
          rsync -a --exclude '.git' --exclude '.github' --exclude 'public' --exclude 'README.md' ./ public/
          touch public/.nojekyll
          ls -la public

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy portfolio'
